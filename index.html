*{box-sizing:inherit; margin:0}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:"Raleway","Segoe UI",Helvetica,Arial,sans-serif; font-weight:500; font-size:17px; line-height:1.6; display:grid; place-items:center; padding:16px}
.card{width:100%; max-width:26rem; background:var(--panel); border:1px solid var(--rule); border-radius:14px; padding:2rem 1.5rem; box-shadow:0 10px 30px rgba(0,0,0,.06)}

h1{font-family:"Playfair Display",Georgia,serif; font-weight:800; color:var(--deep); font-size:1.6rem; line-height:1.15; margin-bottom:.6rem}
p{color:var(--soft); margin-bottom:1.2rem; font-size:.95rem}
label{display:block; font-size:.85rem; font-weight:700; margin-bottom:.4rem}
input{width:100%; font:inherit; color:var(--ink); background:transparent; border:1px solid var(--rule); border-radius:8px; padding:.7rem .85rem}
input:focus{outline:2px solid var(--deep); outline-offset:1px; border-color:transparent}
button{margin-top:.9rem; width:100%; font:inherit; font-weight:700; color:#fff; background:#254E64; border:0; border-radius:8px; padding:.75rem; cursor:pointer}
button:disabled{opacity:.6; cursor:progress}
.msg{min-height:1.4em; margin-top:.7rem; font-size:.88rem; color:var(--err)}
.hidden{display:none}
html.unlocking #gate{visibility:hidden}

<script>
(function(){
  var data = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');
  var enc = new TextEncoder();
  var STORE = 'gate-key:' + data.salt;

  function fromB64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function toB64(u){ var s=''; for (var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }

  async function deriveRaw(password){
    var base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt: fromB64(data.salt), iterations: data.it, hash:'SHA-256' }, base, 256);
    return new Uint8Array(bits);
  }
  async function decryptWith(raw){
    var key = await crypto.subtle.importKey('raw', raw, { name:'AES-GCM' }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: fromB64(data.iv) }, key, fromB64(data.ct));
    return new TextDecoder().decode(pt);
  }
  // Swap the whole document for the decrypted page. Using DOM replacement instead of
  // document.write means it works whether or not the initial parse has finished, so a
  // reload can never end up with the gate and the page stacked together.
  function show(html){
    var next = new DOMParser().parseFromString(html, 'text/html');
    var root = document.adoptNode(next.documentElement);
    document.replaceChild(root, document.documentElement);
    // Scripts adopted from a parsed document are inert; re-create them so they run in order.
    var scripts = Array.prototype.slice.call(document.querySelectorAll('script'));
    scripts.forEach(function(old){
      var s = document.createElement('script');
      for (var i=0;i<old.attributes.length;i++) s.setAttribute(old.attributes[i].name, old.attributes[i].value);
      s.async = false; s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
    // The page may listen for window load; if it already fired, fire it again for the new page.
    if (document.readyState === 'complete') window.dispatchEvent(new Event('load'));
    window.scrollTo(0, 0);
  }
  function whenParsed(fn){
    if (document.readyState !== 'loading') fn();
    else document.addEventListener('DOMContentLoaded', fn, { once: true });
  }

  // Already unlocked in this tab? Reuse the derived key so refreshes don't re-prompt.
  (async function(){
    var saved = null;
    try { saved = sessionStorage.getItem(STORE); } catch (_) {}
    if (!saved) { document.documentElement.classList.remove('unlocking'); return; }
    try {
      var html = await decryptWith(fromB64(saved));
      whenParsed(function(){ show(html); });
    } catch (e) {
      try { sessionStorage.removeItem(STORE); } catch (_) {}
      document.documentElement.classList.remove('unlocking');
      pw.focus();
    }
  })();

  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    msg.textContent = ''; go.disabled = true; go.textContent = 'Checking…';
    try {
      var raw = await deriveRaw(pw.value);
      var html = await decryptWith(raw);
      try { sessionStorage.setItem(STORE, toB64(raw)); } catch (_) {}
      show(html);
    } catch (e) {
      msg.textContent = 'That password is not right. Please try again.';
      pw.select();
    } finally {
      go.disabled = false; go.textContent = 'Open';
    }
  });
})();
</script>
